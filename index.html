<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Три Імперії</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ЕКРАН 1: МЕНЮ -->
  <section id="menu" class="screen">
    <div class="panel">
      <h1 class="logo">ТРИ<span>ІМПЕРІЇ</span></h1>
      <p class="tag">Онлайн-стратегія в реальному часі · 2–3 гравці</p>

      <label class="field">
        <span>Твоє ім'я</span>
        <input id="nameInput" maxlength="16" placeholder="Напиши ім'я" />
      </label>

      <button id="createBtn" class="btn big">Створити кімнату</button>

      <div class="or">або</div>

      <label class="field">
        <span>Код кімнати</span>
        <input id="codeInput" maxlength="6" placeholder="ABC123" autocapitalize="characters" />
      </label>
      <button id="joinBtn" class="btn big ghost">Приєднатися</button>

      <p class="hint">Один створює кімнату, решта вводять її код.</p>
    </div>
  </section>

  <!-- ЕКРАН 2: ЛОБІ -->
  <section id="lobby" class="screen hidden">
    <div class="panel">
      <p class="tag">Код кімнати — дай друзям:</p>
      <div id="roomCode" class="code">------</div>
      <p class="tag">Гравці в кімнаті:</p>
      <ul id="playerList" class="players"></ul>
      <button id="startBtn" class="btn big" disabled>Почати гру</button>
      <p id="lobbyHint" class="hint">Чекаємо на гравців… (мін. 2)</p>
    </div>
  </section>

  <!-- ЕКРАН 3: ГРА -->
  <section id="game" class="screen hidden">
    <canvas id="cv"></canvas>

    <!-- Верхня панель -->
    <div id="hud">
      <div class="hud-item"><span id="hudColor" class="dot"></span><b id="hudGold">0</b><small>золото</small></div>
      <div class="hud-item"><b id="hudUnits">0</b><small>військ</small></div>
      <div class="hud-item"><b id="hudRoom">----</b><small>кімната</small></div>
    </div>

    <!-- Банер підказки режиму -->
    <div id="banner" class="hidden"></div>

    <!-- Підменю створення юнітів -->
    <div id="unitMenu" class="submenu hidden">
      <button class="btn s" data-unit="soldier">Солдат<small>20</small></button>
      <button class="btn s" data-unit="archer">Лучник<small>30</small></button>
      <button class="btn s" data-unit="tank">Танк<small>60</small></button>
    </div>

    <!-- Підменю будівництва -->
    <div id="buildMenu" class="submenu hidden">
      <button class="btn s" data-build="mine">Шахта<small>40</small></button>
      <button class="btn s" data-build="barracks">Казарма<small>50</small></button>
      <button class="btn s" data-build="tower">Вежа<small>60</small></button>
    </div>

    <!-- Головні кнопки -->
    <div id="controls">
      <button id="armyBtn"   class="btn ctrl">Армія</button>
      <button id="makeBtn"   class="btn ctrl">Створити</button>
      <button id="buildBtn"  class="btn ctrl">Будувати</button>
      <button id="attackBtn" class="btn ctrl">Атака</button>
    </div>

    <!-- Екран перемоги/поразки -->
    <div id="overlay" class="hidden">
      <div class="panel">
        <h2 id="overTitle">—</h2>
        <button id="againBtn" class="btn big">Нова гра</button>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
