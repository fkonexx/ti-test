<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1017" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/red_guild.png" />
  <title>Чотири Імперії</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- МЕНЮ -->
  <section id="menu" class="screen">
    <div class="menuwrap">
      <div class="brand">
        <h1 class="logo">ЧОТИРИ<span>ІМПЕРІЇ</span></h1>
        <p class="tag">Онлайн-стратегія · 2–4 гравці · туман війни</p>
      </div>

      <button class="pcard" id="profileBtn">
        <div class="pavatar" id="pAvatar">🛡️</div>
        <div class="pinfo">
          <div class="pname" id="pName">Гравець</div>
          <div class="psub" id="pSub">Профіль і статистика ›</div>
        </div>
      </button>

      <div class="menu-actions">
        <button id="createBtn" class="btn big">🏰 Створити кімнату</button>
        <div class="joinrow">
          <input id="codeInput" maxlength="6" placeholder="КОД" autocapitalize="characters" />
          <button id="joinBtn" class="btn big ghost">Приєднатися</button>
        </div>
      </div>

      <div class="menu-sec">
        <button id="tutorialBtn" class="btn line">🎓 Туторіал</button>
        <button id="testBtn" class="btn line">🧪 Тестовий режим</button>
      </div>

      <button id="menuFsBtn" class="btn ghostsm">⛶ На весь екран / додати на головний</button>
      <input id="nameInput" type="hidden" />
    </div>
  </section>

  <!-- ЛОБІ -->
  <section id="lobby" class="screen hidden">
    <div class="panel">
      <p class="tag">Код кімнати — дай друзям:</p>
      <div id="roomCode" class="code">------</div>
      <p class="tag">Гравці:</p>
      <ul id="playerList" class="players"></ul>
      <div id="cfgToggles" class="cfgrow"></div>
      <button id="startBtn" class="btn big" disabled>Почати гру</button>
      <p id="lobbyHint" class="hint">Чекаємо гравців…</p>
      <button id="lobbyExitBtn" class="btn ghostsm">⬅ У головне меню</button>
    </div>
  </section>

  <!-- ГРА -->
  <section id="game" class="screen hidden">
    <canvas id="cv"></canvas>

    <div id="top">
      <div id="res"></div>
      <div id="hudinfo"></div>
      <button id="audioBtn" class="icon" title="Звук і музика">&#128266;</button>
      <button id="pauseBtn" class="icon" title="Пауза">&#9208;</button>
      <button id="fsBtn" class="icon" title="На весь екран">&#9974;</button>
    </div>

    <div id="banner" class="hidden"></div>

    <div id="unitMenu" class="submenu hidden"></div>
    <div id="buildMenu" class="submenu hidden"></div>

    <div id="techPanel" class="hidden">
      <div class="techhead">
        <b>Дерево розвитку</b>
        <span>Жетони: <b id="tokTop">0</b> &#128295;</span>
        <button id="techClose" class="icon">&#10005;</button>
      </div>
      <div id="techList"></div>
    </div>

    <button id="selBtn" class="sidebtn" title="Виділення / рух карти">&#9635;<small>Виділення</small></button>
    <button id="modeBtn" class="sidebtn" title="Уся карта на екран">&#128506;<small>Карта</small></button>

    <div id="zoom">
      <button id="homeBtn" class="icon" title="До гільдії">&#127963;</button>
      <button id="zoomIn" class="icon">+</button>
      <button id="zoomOut" class="icon">&#8722;</button>
    </div>

    <div id="ctxbar" class="hidden"></div>

    <div id="controls">
      <button id="attackBtn" class="btn ctrl"><i>&#127919;</i>Наказ</button>
      <button id="groupBtn"  class="btn ctrl"><i>&#128101;</i>Військо</button>
      <button id="armyBtn"   class="btn ctrl"><i>&#9876;</i>Армія</button>
      <button id="buildBtn"  class="btn ctrl"><i>&#127959;</i>Будувати</button>
      <button id="scoutBtn"  class="btn ctrl"><i>&#128101;</i>Герої</button>
      <button id="techBtn"   class="btn ctrl"><i>&#9881;</i>Розвиток</button>
    </div>

    <div id="tutOverlay" class="hidden"></div>
    <div id="overlay" class="hidden">
      <div class="panel"><h2 id="overTitle">&#8212;</h2><button id="againBtn" class="btn big">Нова гра</button></div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
    <div id="profileOverlay" class="hidden">
      <div class="profcard">
        <button class="pclose" id="profClose">&#10005;</button>
        <div class="profhead">
          <div class="pavatar big" id="pAvatar2">🛡️</div>
          <div>
            <div class="pname" id="pName2">Гравець</div>
            <button id="editNameBtn" class="mini">✏️ Змінити ім'я</button>
          </div>
        </div>
        <div class="profstats" id="profStats"></div>
        <button id="resetStatsBtn" class="btn ghostsm">Скинути статистику</button>
      </div>
    </div>
</body>
</html>
