<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1017" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/red_guild.png" />
  <title>Чотири Імперії</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- МЕНЮ -->
  <section id="menu" class="screen">
    <div class="panel">
      <h1 class="logo">ЧОТИРИ<span>ІМПЕРІЇ</span></h1>
      <p class="tag">Онлайн-стратегія · 2–4 гравці · туман війни</p>
      <label class="field"><span>Твоє ім'я</span><input id="nameInput" maxlength="16" placeholder="Напиши ім'я" /></label>
      <button id="createBtn" class="btn big">Створити кімнату</button>
      <div class="or">або</div>
      <label class="field"><span>Код кімнати</span><input id="codeInput" maxlength="6" placeholder="ABC123" autocapitalize="characters" /></label>
      <button id="joinBtn" class="btn big ghost">Приєднатися</button>
      <p class="hint">Один створює кімнату, решта вводять її код.<br>Тестовий режим — код <b>lnq247</b>.</p>
    </div>
  </section>

  <!-- ЛОБІ -->
  <section id="lobby" class="screen hidden">
    <div class="panel">
      <p class="tag">Код кімнати — дай друзям:</p>
      <div id="roomCode" class="code">------</div>
      <p class="tag">Гравці:</p>
      <ul id="playerList" class="players"></ul>
      <button id="startBtn" class="btn big" disabled>Почати гру</button>
      <p id="lobbyHint" class="hint">Чекаємо гравців…</p>
    </div>
  </section>

  <!-- ГРА -->
  <section id="game" class="screen hidden">
    <canvas id="cv"></canvas>

    <div id="top">
      <div id="res"></div>
      <button id="muteBtn" class="icon" title="Звук">&#128266;</button>
      <button id="musBtn" class="icon" title="Музика">&#127925;</button>
      <button id="fsBtn" class="icon" title="На весь екран">&#9974;</button>
    </div>

    <div id="banner" class="hidden"></div>

    <div id="unitMenu" class="submenu hidden"></div>
    <div id="buildMenu" class="submenu hidden"></div>

    <div id="techPanel" class="hidden">
      <div class="techhead">
        <b>Дерево розвитку</b>
        <span>Жетони: <b id="tokTop">0</b> &#128295;</span>
        <button id="techClose" class="icon">&#10005;</button>
      </div>
      <div id="techList"></div>
    </div>

    <button id="modeBtn" class="sidebtn" title="Режим керування">&#128506;<small>Карта</small></button>

    <div id="zoom">
      <button id="homeBtn" class="icon" title="До гільдії">&#127963;</button>
      <button id="zoomIn" class="icon">+</button>
      <button id="zoomOut" class="icon">&#8722;</button>
    </div>

    <div id="ctxbar" class="hidden"></div>

    <div id="controls">
      <button id="attackBtn" class="btn ctrl"><i>&#127919;</i>Атака</button>
      <button id="armyBtn"   class="btn ctrl"><i>&#9876;</i>Армія</button>
      <button id="buildBtn"  class="btn ctrl"><i>&#127959;</i>Будувати</button>
      <button id="scoutBtn"  class="btn ctrl"><i>&#128301;</i>Розвідник</button>
      <button id="techBtn"   class="btn ctrl"><i>&#9881;</i>Розвиток</button>
    </div>

    <div id="overlay" class="hidden">
      <div class="panel"><h2 id="overTitle">&#8212;</h2><button id="againBtn" class="btn big">Нова гра</button></div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
